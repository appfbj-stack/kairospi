<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe-zone margin for maskable icon -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)" stroke="#334155" stroke-width="6" />

  <!-- Inner ambient glow -->
  <circle cx="256" cy="256" r="140" fill="url(#primaryGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- Stylized Kairós "K" + Chronos / Time Dial -->
  <g transform="translate(256,256)">
    <!-- Outer ring notches -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="6 14" opacity="0.6" />
    <circle cx="0" cy="0" r="115" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.8" />

    <!-- Stylized "K" glyph constructed with modern speed strokes -->
    <!-- Vertical stem -->
    <rect x="-65" y="-80" width="22" height="160" rx="11" fill="url(#primaryGrad)" />
    
    <!-- Upper wing -->
    <path d="M -45 -10 L 45 -80 C 52 -86, 62 -78, 56 -70 L -15 0 Z" fill="url(#primaryGrad)" />
    
    <!-- Lower wing -->
    <path d="M -20 -5 L 55 70 C 62 78, 52 86, 44 80 L -45 5 Z" fill="url(#primaryGrad)" />

    <!-- Central intelligence spark / Time core -->
    <circle cx="0" cy="0" r="12" fill="#ffffff" filter="url(#glow)" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" />
    
    <!-- Pi orbit dots -->
    <circle cx="95" cy="-45" r="5" fill="url(#goldGrad)" />
    <circle cx="-85" cy="65" r="4" fill="#38bdf8" />
  </g>
</svg>
